on: [push, pull_request]
name: Run tests
jobs:
  # Keep OS coverage for platform-sensitive runtime behavior.
  check:
    name: "check: ${{matrix.os}}"
    runs-on: "${{matrix.os}}"

    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: x
    steps:
    - name: Turn off git core.autocrlf
      if: matrix.os == 'windows-latest'
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: 'go install necessary tools'
      if: always()
      run: |
        go install github.com/maruel/pat/cmd/ba@v0.0.4
    - name: 'Check: go test -cover'
      if: always()
      run: make test
      # Don't send code coverage if anything failed to reduce spam.
    - uses: codecov/codecov-action@v7
      with:
        token: ${{secrets.CODECOV_TOKEN}}
    - name: 'Cleanup'
      if: always()
      run: rm coverage.txt
    - name: 'Check: go test -race'
      run: make test-race
    - name: 'Check: benchmark 📈'
      run: ba -against HEAD~1
    - name: 'Check: go test (CGO_ENABLED=0)'
      env:
        CGO_ENABLED: 0
      run: make test
    - name: 'Check: go test (32 bits)'
      if: matrix.os != 'macos-latest'
      env:
        GOARCH: 386
      run: make test
    - name: "Check: tree is clean"
      if: always()
      run: |
        # Nothing should have changed in the tree up to that point and no
        # unsuspected file was created.
        TOUCHED=$(git status --porcelain)
        if ! test -z "$TOUCHED"; then
          echo "Oops, something touched these files, please cleanup:"
          echo "$TOUCHED"
          git diff
          false
        fi
    - name: Static checks
      if: always()
      run: make verify
    - name: "Check: go generate doesn't modify files"
      if: always()
      run: |
        go generate ./...
        # Also test for nonignored untracked files.
        TOUCHED=$(git status --porcelain)
        if ! test -z "$TOUCHED"; then
          echo "go generate created these files, please fix:"
          echo "$TOUCHED"
          false
        fi

  codeql:
    name: "codeql: ${{matrix.os}}"
    runs-on: "${{matrix.os}}"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: go
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
